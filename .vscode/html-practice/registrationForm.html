<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>
</head>

<body>

    <main>

        <section>

            <h1>Create Account</h1>

            <form action="/register" method="post">

                <!-- Full Name -->
                <div>
                    <label for="fullName">Full Name</label>

                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name"
                        autocomplete="name" minlength="3" maxlength="50" required>
                </div>

                <br>

                <!-- Email -->
                <div>
                    <label for="email">Email Address</label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        required>
                </div>

                <br>

                <!-- Phone -->
                <div>
                    <label for="phone">Phone Number</label>

                    <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit phone number"
                        autocomplete="tel" inputmode="numeric" pattern="[0-9]{10}" required>
                </div>

                <br>

                <!-- Date of Birth -->
                <div>
                    <label for="dob">Date of Birth</label>

                    <input type="date" id="dob" name="dob" required>
                </div>

                <br>

                <!-- Gender -->
                <fieldset>

                    <legend>Gender</legend>

                    <input type="radio" id="male" name="gender" value="male" required>

                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">

                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">

                    <label for="other">Other</label>

                </fieldset>

                <br>

                <!-- Password -->
                <div>
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" placeholder="Create a password"
                        autocomplete="new-password" minlength="8" required>
                </div>

                <br>

                <!-- Confirm Password -->
                <div>
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Enter password again" autocomplete="new-password" minlength="8" required>
                </div>

                <br>

                <!-- Terms -->
                <div>
                    <input type="checkbox" id="terms" name="terms" required>

                    <label for="terms">
                        I agree to the Terms and Conditions
                    </label>
                </div>

                <br>

                <button type="submit">
                    Register
                </button>

                <button type="reset">
                    Reset
                </button>

            </form>

        </section>

    </main>

</body>

</html>
