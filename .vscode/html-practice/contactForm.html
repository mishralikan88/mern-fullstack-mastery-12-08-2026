<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>
</head>

<body>

    <main>

        <section>

            <h1>Contact Us</h1>

            <p>
                Have a question? Send us a message.
            </p>

            <form action="/contact" method="post">

                <!-- Full Name -->
                <div>
                    <label for="fullName">
                        Full Name
                    </label>

                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name"
                        autocomplete="name" minlength="3" maxlength="50" required>
                </div>

                <br>

                <!-- Email -->
                <div>
                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        required>
                </div>

                <br>

                <!-- Phone -->
                <div>
                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="tel"
                        inputmode="numeric" pattern="[0-9]{10}">
                </div>

                <br>

                <!-- Subject -->
                <div>
                    <label for="subject">
                        Subject
                    </label>

                    <select id="subject" name="subject" required>
                        <option value="">
                            Select a subject
                        </option>

                        <option value="general">
                            General Enquiry
                        </option>

                        <option value="support">
                            Technical Support
                        </option>

                        <option value="billing">
                            Billing
                        </option>

                        <option value="feedback">
                            Feedback
                        </option>
                    </select>
                </div>

                <br>

                <!-- Preferred Contact Method -->
                <fieldset>

                    <legend>
                        Preferred Contact Method
                    </legend>

                    <input type="radio" id="contactEmail" name="contactMethod" value="email" required>

                    <label for="contactEmail">
                        Email
                    </label>

                    <input type="radio" id="contactPhone" name="contactMethod" value="phone">

                    <label for="contactPhone">
                        Phone
                    </label>

                </fieldset>

                <br>

                <!-- Message -->
                <div>
                    <label for="message">
                        Message
                    </label>

                    <br>

                    <textarea id="message" name="message" rows="6" cols="40" minlength="10" maxlength="500"
                        placeholder="Enter your message" required></textarea>
                </div>

                <br>

                <!-- Copy -->
                <div>
                    <input type="checkbox" id="sendCopy" name="sendCopy">

                    <label for="sendCopy">
                        Send me a copy of this message
                    </label>
                </div>

                <br>

                <!-- Buttons -->
                <button type="submit">
                    Send Message
                </button>

                <button type="reset">
                    Clear
                </button>

            </form>

        </section>

    </main>

</body>

</html>
